<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Translator</title>
<style>
  :root{--bg:#0e0f11;--card:#17191c;--ink:#f4f4f2;--mute:#8b8f96;--accent:#e8e2d4;--rec:#d64545;--line:#25282c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  body{display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  select{min-width:0;flex:1 1 0;max-width:220px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
  #stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px 0;min-height:0}
  #english{font-size:clamp(28px,7vw,44px);line-height:1.2;font-weight:600;letter-spacing:-.01em;min-height:1.2em}
  #english.empty{color:var(--mute);font-weight:500}
  #heard{font-size:17px;color:var(--mute);line-height:1.4;min-height:1.4em}
  #status{font-size:14px;color:var(--mute);height:18px}
  #btnwrap{display:flex;justify-content:center;padding:8px 0 18px}
  #mic{width:132px;height:132px;border-radius:50%;border:0;background:var(--accent);color:#111;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s ease,background .2s ease;position:relative}
  #mic:active{transform:scale(.96)}
  #mic.on{background:var(--rec);color:#fff}
  #mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--rec);animation:pulse 1.2s ease-out infinite}
  @keyframes pulse{from{opacity:.7;transform:scale(.95)}to{opacity:0;transform:scale(1.25)}}
  @media (prefers-reduced-motion:reduce){#mic.on::after{animation:none}}
  #hist{max-height:30vh;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
  .h{padding:10px 0;border-bottom:1px solid var(--line)}
  .h b{display:block;font-weight:500;font-size:17px}
  .h span{color:var(--mute);font-size:14px}
  .tools{display:flex;gap:8px;flex:none}
  #box{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:16px/1.4 inherit;font-family:inherit;resize:none;margin-bottom:12px}
  #box::placeholder{color:var(--mute)}
  button.sm{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<header>
  <select id="lang" aria-label="Language you are listening to">
    <option value="es-PR">Spanish (Puerto Rico)</option>
    <option value="es-ES">Spanish (Spain)</option>
    <option value="es-MX">Spanish (Latin America)</option>
    <option value="pt-BR">Portuguese</option>
    <option value="fr-FR">French</option>
    <option value="it-IT">Italian</option>
    <option value="de-DE">German</option>
    <option value="zh-CN">Chinese</option>
    <option value="ja-JP">Japanese</option>
    <option value="ko-KR">Korean</option>
    <option value="ru-RU">Russian</option>
    <option value="ar-SA">Arabic</option>
  </select>
  <div class="tools">
    <button class="sm" id="speak">Voice: off</button>
    <button class="sm" id="clear">Clear</button>
  </div>
</header>

<div id="stage">
  <div id="english" class="empty">Tap the button and talk</div>
  <div id="heard"></div>
  <div id="status"></div>
</div>

<div id="btnwrap"><button id="mic">Listen</button></div>
<textarea id="box" rows="2" placeholder="Or dictate here with Wispr (tap, then use Wispr). Translates automatically." aria-label="Dictation box"></textarea>
<div id="hist"></div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('mic'), eng = $('english'), heard = $('heard'), status = $('status'), hist = $('hist'), langSel = $('lang');
let rec = null, listening = false, speakOn = false, seq = 0, langFallback = null;

try { const s = localStorage.getItem('lang'); if (s) langSel.value = s; } catch(e){}
langSel.onchange = () => { try { localStorage.setItem('lang', langSel.value); } catch(e){} if (listening) stop(); };

// Puerto Rican / Caribbean Spanish -> standard Spanish, applied before translating.
// Each entry fixes a phrase Google Translate got wrong in testing (2026-11-22).
// Whole-word match that works with accented letters (plain \b does not).
const W = src => new RegExp('(?<!\\p{L})(?:' + src + ')(?!\\p{L})', 'giu');
const PR_FIXES = [
  [W('jugo de china'), 'jugo de naranja'], [W('una china'), 'una naranja'], [W('chinas'), 'naranjas'],
  [W('chavos'), 'dinero'],
  [W('corillo'), 'grupo de amigos'],
  [W('pichear'), 'ignorar'], [W('pichea'), 'ignora'], [W('picheó'), 'ignoró'], [W('picheando'), 'ignorando'], [W('me piché'), 'ignoré'],
  [W('revolú'), 'desorden'],
  [W('pon'), 'aventón'],
  [W('brutal'), 'genial'],
  [W('nítido|nítida'), 'excelente'],
  [W('wepa'), '¡qué bien!'],
  [W('ay bendito'), 'ay, qué pena'],
  [W('acho'), 'hombre'],
  [W('toy'), 'estoy'], [W('tamo'), 'estamos'], [W('vamo'), 'vamos'],
  [W("pa'?"), 'para'], [W("na'"), 'nada'],
  // dropped "d": cansao -> cansado (skip real -ao words)
  [W('(?!bacalao|cacao|callao)(\\p{L}+)ao'), '$1ado'],
];
function normalizeSpanish(t) { for (const [re, rep] of PR_FIXES) t = t.replace(re, rep); return t; }

async function translate(text, from) {
  const sl = from.split('-')[0];
  if (sl === 'es') text = normalizeSpanish(text);
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=en&dt=t&q=' + encodeURIComponent(text));
    if (!r.ok) throw 0;
    const j = await r.json();
    return j[0].map(x => x[0]).join('').trim();
  } catch (e) {
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + sl + '|en');
    const j = await r.json();
    if (!j.responseData || !j.responseData.translatedText) throw new Error('translate failed');
    return j.responseData.translatedText;
  }
}

// Accurate final translation: Claude (Supabase edge function) understands PR accent, slang and
// mis-heard words. Falls back to the Google result if it fails or takes over 6 seconds.
const SMART_URL = 'https://cbzibwwplygnzmvexfrf.supabase.co/functions/v1/translate';
const recentSpanish = [];
async function smartTranslate(text, alts) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(SMART_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({ text, alts, context: recentSpanish.slice(-3) }) });
    const j = await r.json();
    if (!r.ok || !j.english) throw new Error(j.error || 'failed');
    return j.english;
  } finally { clearTimeout(to); }
}

function setEnglish(t) { eng.textContent = t; eng.classList.remove('empty'); }

function start() {
  if (!SR) { status.textContent = 'This browser has no speech recognition. Use Chrome or Safari.'; return; }
  rec = new SR();
  rec.lang = (langSel.value === 'es-PR' && langFallback) ? langFallback : langSel.value;
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 3;
  let finalText = '', finalAlts = [], lastInterimTranslated = '', timer = null;

  rec.onstart = () => { listening = true; mic.classList.add('on'); mic.textContent = 'Stop'; status.textContent = 'Listening…'; heard.textContent = ''; };
  rec.onresult = e => {
    let interim = '';
    finalText = ''; finalAlts = ['', ''];
    for (let i = 0; i < e.results.length; i++) {
      const res = e.results[i], t = res[0].transcript;
      if (res.isFinal) {
        finalText += t;
        for (let k = 1; k <= 2; k++) finalAlts[k - 1] += (res[k] || res[0]).transcript;
      } else interim += t;
    }
    heard.textContent = finalText + interim;
    // Live preview: translate partial speech every ~600ms while talking.
    const partial = (finalText + interim).trim();
    if (partial && partial !== lastInterimTranslated && !timer) {
      timer = setTimeout(async () => {
        timer = null;
        const mine = ++seq, p = partial;
        lastInterimTranslated = p;
        try { const en = await translate(p, rec ? rec.lang : langSel.value); if (mine === seq) setEnglish(en); } catch(e){}
      }, 600);
    }
  };
  rec.onerror = e => {
    // Some browsers (likely iPhone Safari) may not know es-PR: fall back to US Spanish.
    if (e.error === 'language-not-supported' && rec.lang === 'es-PR') { rec.onend = null; rec = null; listening = false; langFallback = 'es-US'; start(); return; }
    const msg = { 'not-allowed': 'Microphone blocked. Allow it in the browser address bar.', 'no-speech': 'Heard nothing. Tap and try again.', 'audio-capture': 'No microphone found.', 'network': 'Speech service needs internet.' };
    status.textContent = msg[e.error] || ('Error: ' + e.error);
  };
  rec.onend = async () => {
    listening = false; mic.classList.remove('on'); mic.textContent = 'Listen';
    if (timer) { clearTimeout(timer); timer = null; }
    const text = (finalText || heard.textContent).trim();
    if (!text) return;
    const alts = [...new Set(finalAlts.map(a => a.trim()))].filter(a => a && a !== text);
    await translateLine(text, alts);
  };
  status.textContent = 'Starting mic… if the browser asks, tap Allow.';
  try { rec.start(); } catch (e) { status.textContent = 'Could not start the mic: ' + e.message; }
}
function stop() { if (rec) rec.stop(); }

async function translateLine(text, alts) {
    status.textContent = 'Translating…';
    const mine = ++seq, lang = langSel.value;
    // Fast result first (Google), then the accurate one (Claude) replaces it for Spanish.
    const quick = translate(text, lang).catch(() => null);
    const smart = lang.startsWith('es') ? smartTranslate(text, alts).catch(() => null) : Promise.resolve(null);
    const q = await quick;
    if (mine !== seq) return;
    if (q) { setEnglish(q); }
    if (lang.startsWith('es')) status.textContent = 'Improving…';
    const s = await smart;
    if (mine !== seq) return;
    const en = s || q;
    if (!en) { status.textContent = 'Translation failed. Check your connection.'; return; }
    setEnglish(en); status.textContent = '';
    recentSpanish.push(text); if (recentSpanish.length > 5) recentSpanish.shift();
    const d = document.createElement('div'); d.className = 'h';
    d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = en; d.lastChild.textContent = text;
    hist.prepend(d);
    if (speakOn) { const u = new SpeechSynthesisUtterance(en); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
}

// Wispr Flow (or any dictation keyboard) types into this box. Translate as soon as text
// lands, then empty the box so the next dictation starts fresh.
const box = $('box');
let boxTimer = null;
box.addEventListener('input', () => {
  clearTimeout(boxTimer);
  boxTimer = setTimeout(async () => {
    const t = box.value.trim();
    if (!t) return;
    heard.textContent = t;
    box.value = '';
    await translateLine(t, []);
  }, 700);
});

mic.onclick = () => listening ? stop() : start();
$('speak').onclick = e => { speakOn = !speakOn; e.target.textContent = 'Voice: ' + (speakOn ? 'on' : 'off'); };
$('clear').onclick = () => { hist.innerHTML = ''; heard.textContent = ''; eng.textContent = 'Tap the button and talk'; eng.classList.add('empty'); status.textContent = ''; };
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); mic.click(); } });
</script>
</body>
</html>
